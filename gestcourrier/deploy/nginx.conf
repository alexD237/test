# ArchivRH — configuration Nginx (intranet PAD)
# Sert le frontend React (build), le static Django et proxifie l'API vers
# Gunicorn. Les PDF (MEDIA_ROOT) ne sont JAMAIS exposés directement : ils
# transitent uniquement par /api/courriers/{id}/pdf/ avec vérification JWT.

upstream gestcourrier_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name gestcourrier.drh.pad.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gestcourrier.drh.pad.local;

    ssl_certificate     /etc/ssl/pad/gestcourrier.crt;
    ssl_certificate_key /etc/ssl/pad/gestcourrier.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Taille max des uploads PDF (20 Mo + marge).
    client_max_body_size 25M;

    # En-têtes de sécurité (CDC 5.3) — complètent ceux posés par Django.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # API Django (Gunicorn).
    location /api/ {
        proxy_pass http://gestcourrier_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Espace d'administration Django (optionnel, réservé DSI).
    location /admin/ {
        proxy_pass http://gestcourrier_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers statiques Django (collectstatic).
    location /static/ {
        alias /opt/gestcourrier/backend/staticfiles/;
        expires 30d;
    }

    # Frontend React (build Vite).
    root /opt/gestcourrier/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
